[package]
name = "papertrail-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[[bin]]
name = "paper-trail-tui"
path = "src/main.rs"

[dependencies]
papertrail-core.workspace = true
papertrail-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = { version = "0.7", features = ["search"] }
dirs = "6"
shell-words = "1"
unicode-width = "=0.2.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
