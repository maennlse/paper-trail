[package]
name = "papertrail-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[[bin]]
name = "paper-trail-tui"
path = "src/main.rs"

[dependencies]
papertrail-core.workspace = true
papertrail-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = "0.29"
tui-textarea = { package = "ratatui-textarea", version = "0.9.4", features = ["search"] }
dirs = "7"
shell-words = "1"
unicode-width = "=0.2.0"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
