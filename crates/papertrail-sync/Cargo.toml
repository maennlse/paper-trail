[package]
name = "papertrail-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[dependencies]
papertrail-crypto.workspace = true
papertrail-core.workspace = true
papertrail-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "reqwest-blocking", "rustls-tls"] }
zeroize = "1"
fs2 = "0.4"
webbrowser = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
