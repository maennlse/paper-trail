[package]
name = "papertrail-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
papertrail-core.workspace = true
papertrail-storage.workspace = true
papertrail-sync.workspace = true
serde_json.workspace = true
uniffi = "=0.32.2"
thiserror = "2"
zeroize = "1"

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "papertrail-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dev-dependencies]
tempfile = "3"
