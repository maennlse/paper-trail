name: PaperTrail
packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    revision: 592434a103a4d1ab83e14f87ac6eef569dd7a99d # 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    revision: 15cf3a9ec3ab95e0d058b7df9f35619123c9e02d # 0.1.10, Runestone 0.5.2 compatible
options:
  bundleIdPrefix: io.github.maennlse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PaperTrail:
    type: application
    platform: iOS
    dependencies: &editorDependencies
      - package: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterLanguagesCommon
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownRunestone
      - package: TreeSitterLanguages
        product: TreeSitterMarkdownInlineRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterPythonRunestone
      - package: TreeSitterLanguages
        product: TreeSitterRustRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJavaScriptRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSwiftRunestone
      - package: TreeSitterLanguages
        product: TreeSitterTOMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterHTMLRunestone
      - package: TreeSitterLanguages
        product: TreeSitterCSSRunestone
      - package: TreeSitterLanguages
        product: TreeSitterSQLRunestone
    sources:
      - Sources
      - Resources
      - path: Generated
        includes: ["*.swift"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Paper Trail
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: Paper Trail OAuth
            CFBundleURLSchemes: [io.github.maennlse.paper-trail]
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maennlse.paper-trail
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PaperTrail-Bridging-Header.h
        HEADER_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/Generated"'
        LIBRARY_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/build/rust/$(PLATFORM_NAME)"'
        OTHER_LDFLAGS: "$(inherited) -lpapertrail_ffi -framework Security -framework CoreFoundation -framework SystemConfiguration -framework CFNetwork -lc++ -lz -liconv"
  PaperTrailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: PaperTrail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PaperTrailStateTests:
    type: bundle.unit-test
    platform: iOS
    dependencies: *editorDependencies
    sources:
      - UnitTests
      - Sources/EditorSaveState.swift
      - Sources/NoteExport.swift
      - Sources/SyntaxHighlighting.swift
      - Sources/SyncRelativeTime.swift
      - Sources/SyncFolderDeletion.swift
      - Sources/NoteTimestamp.swift
      - Sources/NoteFindState.swift
      - Sources/SyncTriggerState.swift
      - Sources/AppVersion.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaperTrail:
    build:
      targets:
        PaperTrail: all
    test:
      targets:
        - PaperTrailUITests
        - PaperTrailStateTests
