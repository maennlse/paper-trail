name: PaperTrail
options:
  bundleIdPrefix: io.github.maennlse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PaperTrail:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Generated
        includes: ["*.swift"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Paper Trail
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: Paper Trail OAuth
            CFBundleURLSchemes: [io.github.maennlse.paper-trail]
        ITSAppUsesNonExemptEncryption: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maennlse.paper-trail
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PaperTrail-Bridging-Header.h
        HEADER_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/Generated"'
        LIBRARY_SEARCH_PATHS: '$(inherited) "$(SRCROOT)/build/rust/$(PLATFORM_NAME)"'
        OTHER_LDFLAGS: "$(inherited) -lpapertrail_ffi -framework Security -framework CoreFoundation -framework SystemConfiguration -framework CFNetwork -lc++ -lz -liconv"
  PaperTrailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: PaperTrail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PaperTrail:
    build:
      targets:
        PaperTrail: all
    test:
      targets:
        - PaperTrailUITests
