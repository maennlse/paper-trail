---
name: Unsigned iOS
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build-aux/*ios*"
      - ".github/workflows/ios.yml"
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-directories: target/ios
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate iOS packaging and icon assets
        run: python3 -m unittest discover -s build-aux -p test_build_ios.py
      - name: Test portable Rust and bridge
        run: cargo test --locked -p papertrail-core -p papertrail-storage -p papertrail-crypto -p papertrail-sync -p papertrail-ffi
      - name: Build unsigned device and simulator apps
        run: python3 build-aux/build_ios.py --output-dir dist/ios
      - name: Run simulator UI and state tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d, reverse=True) if "iOS-26-" in runtime for x in d[runtime] if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/PaperTrail.xcodeproj -scheme PaperTrail \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/UITests.xcresult \
            -parallel-testing-enabled NO \
            test CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
             CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= ARCHS=arm64
      - name: Test material fallback on iOS 18
        run: |
          xcrun simctl shutdown all
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in sorted(d, reverse=True) if "iOS-18-" in runtime for x in d[runtime] if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/PaperTrail.xcodeproj -scheme PaperTrail \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/FallbackTests.xcresult \
            -only-testing:PaperTrailStateTests \
            -only-testing:PaperTrailUITests/PaperTrailUITests/testFindAndPrepareNativeShareWithoutChangingNote \
            -parallel-testing-enabled NO \
            test-without-building CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= ARCHS=arm64
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d ios/build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path ios/build/UITests.xcresult \
              --output-path ios/build/screenshots
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paper-trail-ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paper-trail-ios-unsigned
          path: dist/ios/**
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: paper-trail-ios-test-results
          path: ios/build/*.xcresult
          if-no-files-found: ignore
