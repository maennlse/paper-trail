---
name: Unsigned iOS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build-aux/*ios*"
      - ".github/workflows/ios.yml"
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust targets
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-directories: target/ios
      - name: Install project generator
        run: brew install xcodegen
      - name: Test portable Rust and bridge
        run: cargo test --locked -p papertrail-core -p papertrail-storage -p papertrail-crypto -p papertrail-sync -p papertrail-ffi
      - name: Build unsigned device and simulator apps
        run: python3 build-aux/build_ios.py --output-dir dist/ios
      - name: Run simulator smoke test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/PaperTrail.xcodeproj -scheme PaperTrail \
            -configuration Release -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/UITests.xcresult \
            test CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= ARCHS=arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: paper-trail-ios-unsigned
          path: dist/ios/**
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: paper-trail-ios-test-results
          path: ios/build/UITests.xcresult
          if-no-files-found: ignore
