---
name: Super Linter

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  statuses: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run super-linter
        uses: super-linter/super-linter@9e863354e3ff62e0727d37183162c4a88873df41 # v8.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSCPD: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # Prettier owns JSON formatting; Biome still checks JSON lint rules.
          VALIDATE_BIOME_FORMAT: false
          # Cargo's edition-aware formatter and Clippy run in rust.yml with
          # the GNOME development libraries, absent from this lint container.
          VALIDATE_RUST_2015: false
          VALIDATE_RUST_2018: false
          VALIDATE_RUST_2021: false
          VALIDATE_RUST_2024: false
          VALIDATE_RUST_CLIPPY: false
          # Status checks are sufficient; do not request PR-comment permissions.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          FILTER_REGEX_EXCLUDE: >-
            (^_build/)|(^flatpak-build/)|(^\.flatpak-builder/)|(^repo/)|(^\.jscpd\.json$)
