---
name: Rust
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >-
          cargo test --locked -p papertrail-core -p papertrail-storage
          -p papertrail-tui -p papertrail-crypto -p papertrail-sync
          -p papertrail-server
      - run: >-
          cargo clippy --locked -p papertrail-core -p papertrail-storage
          -p papertrail-tui -p papertrail-crypto -p papertrail-sync
          -p papertrail-server --all-targets -- -D warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    steps:
      - run: >-
          dnf install -y git gcc cmake curl pkgconf-pkg-config gtk4-devel
          libadwaita-devel gtksourceview5-devel xorg-x11-server-Xvfb
          xdotool dbus-daemon meson ninja-build desktop-file-utils appstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unlike hosted runners, the Fedora container has no preinstalled rustup.
      - name: Install Rust in Fedora container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable \
            --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: python3 build-aux/generate_flatpak_sources.py --check
      - run: python3 -m unittest discover -s build-aux -p test_release.py
      - run: python3 -m unittest discover -s build-aux -p test_build_local.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: dbus-run-session -- sh build-aux/test-desktop.sh
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
          PAPERTRAIL_SCREENSHOT: ${{ github.workspace }}/desktop-smoke.png
      - run: cargo build --release --locked --bin paper-trail
      - run: meson setup _build && meson compile -C _build
      - name: Package native GTK executable
        run: python3 build-aux/package_desktop.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-trail-gtk-linux-${{ matrix.arch }}
          path: |
            target/release/paper-trail
            desktop-smoke*.png
            dist/paper-trail-gtk-linux-${{ matrix.arch }}.tar.gz
            dist/paper-trail-gtk-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # SDK updates rename/link OSTree files; keep the preinstalled repository
      # on one writable filesystem rather than the container's overlay layers.
      options: --privileged --volume /var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: paper-trail.flatpak
          arch: ${{ matrix.arch }}
          manifest-path: io.github.maennlse.paper-trail.json
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false
      - name: Package Flatpak bundle
        run: |
          mkdir -p dist
          cp paper-trail.flatpak dist/paper-trail-gtk-linux-${{ matrix.arch }}.flatpak
          cd dist
          sha256sum paper-trail-gtk-linux-${{ matrix.arch }}.flatpak > paper-trail-gtk-linux-${{ matrix.arch }}.flatpak.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-trail-gtk-flatpak-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
