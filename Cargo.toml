[workspace]
members = ["crates/papertrail-core", "crates/papertrail-storage", "crates/papertrail-desktop", "crates/papertrail-tui", "crates/papertrail-crypto", "crates/papertrail-sync", "crates/papertrail-server"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
papertrail-core = { path = "crates/papertrail-core" }
papertrail-storage = { path = "crates/papertrail-storage" }
papertrail-crypto = { path = "crates/papertrail-crypto" }
papertrail-sync = { path = "crates/papertrail-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
lto = "thin"
strip = "debuginfo"
